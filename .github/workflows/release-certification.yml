name: Release Certification

# Reusable certification job for native packaging workflows. It runs the same
# fail-closed certification as CI (`npm run test:cert`, including the isolated
# PostgreSQL onboarding certificate) and hands the commit-bound result file to
# the caller, so `prebuild` keeps refusing uncertified or wrong-commit builds.

on:
  workflow_call:

jobs:
  certify:
    name: Release certification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: breedlog
          POSTGRES_PASSWORD: breedlog
          POSTGRES_DB: breedlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://breedlog:breedlog@localhost:5432/breedlog_test
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret
      ADMIN_PIN: "0000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run certification
        run: npm run test:cert

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification
          path: artifacts/release-certification.json
          if-no-files-found: error

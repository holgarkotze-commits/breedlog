name: Prove Namibia Livestock Market Cloudflare Deployment

on:
  pull_request:
    branches:
      - ci/livestock-market-proof-runner
    paths:
      - 'ops/namibia-livestock-market-live/**'

permissions:
  contents: read

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/namibia-livestock-market-live
    env:
      CI: 'true'
      NO_COLOR: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout PR content
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and Wrangler config
        run: |
          set -euo pipefail
          node --check worker/index.js
          node --check public/app.js
          node --check public/fallback-data.js
          node --check public/sw.js
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest deploy --dry-run

      - name: Deploy to Cloudflare with redacted public output
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.raw.log wrangler.redacted.log

          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            MODE="permanent"
            npx --yes wrangler@latest deploy > wrangler.raw.log 2>&1
          else
            MODE="temporary"
            node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          delete cfg.triggers;
          fs.writeFileSync('wrangler.temporary.json', JSON.stringify(cfg, null, 2));
          NODE
            unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            npx --yes wrangler@latest deploy --temporary --config wrangler.temporary.json > wrangler.raw.log 2>&1
          fi

          CLAIM_URL="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]`\"]+' wrangler.raw.log | tail -n 1 || true)"
          [[ -z "$CLAIM_URL" ]] || echo "::add-mask::$CLAIM_URL"
          sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]`\"]+#CLAIM_URL_REDACTED#g' wrangler.raw.log > wrangler.redacted.log
          cat wrangler.redacted.log

          LIVE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler.raw.log | tail -n 1 || true)"
          if [[ -z "$LIVE_URL" ]]; then
            echo "No workers.dev endpoint found in Wrangler output." >&2
            exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "LIVE_URL=$LIVE_URL" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "live_url=$LIVE_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment mode: $MODE"
          echo "Live URL: $LIVE_URL"

      - name: Live HTTP proof
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 "$LIVE_URL/api/health" -o health.json; then break; fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 90 "$LIVE_URL/api/live?species=cattle&from=2026-01-01" -o cattle.json
          curl --fail --silent --show-error --max-time 90 "$LIVE_URL/api/live?species=sheep&from=2026-01-01" -o sheep.json
          curl --fail --silent --show-error --max-time 90 "$LIVE_URL/api/live?species=goat&from=2026-01-01" -o goat.json
          curl --fail --silent --show-error --max-time 30 "$LIVE_URL/" -o live-index.html
          node - <<'NODE'
          const fs = require('fs');
          const result = {health: JSON.parse(fs.readFileSync('health.json','utf8')), species:{}};
          for (const species of ['cattle','sheep','goat']) {
            const j = JSON.parse(fs.readFileSync(`${species}.json`,'utf8'));
            result.species[species] = {
              observations: j.summary?.observations ?? 0,
              classes: j.summary?.classes ?? [],
              venues: j.summary?.venues?.length ?? 0,
              latest_discovered: j.latest_discovered ?? null,
              latest_parsed: j.latest_parsed ?? null,
              source_errors: (j.errors || []).length
            };
            if (!result.species[species].observations) throw new Error(`Zero ${species} observations.`);
          }
          if (!fs.readFileSync('live-index.html','utf8').includes('Namibia Livestock Market')) throw new Error('Root UI identity missing.');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Summary
        if: success()
        run: |
          {
            echo '## Namibia Livestock Market Live — proof passed'
            echo ''
            echo "- Cloudflare mode: **$MODE**"
            echo "- Live URL: $LIVE_URL"
            echo '- UI: **PASS**'
            echo '- Cattle API: **PASS**'
            echo '- Sheep API: **PASS**'
            echo '- Goat API: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"
